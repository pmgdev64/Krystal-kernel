# --- GLOBAL GRAPHICS SETTINGS ---
term_graphics: yes

term_width: 1280
term_height: 720
term_bpp: 32

# Wallpaper config (Using both old/new keys)
wallpaper: boot():/boot/res/bootsplash.bmp
wallpaper_style: stretched
term_background: 80000000

# UI Styling (AARRGGBB)
term_foreground: ffffffff
term_background_text: 00000000
term_foreground_highlight: ff00ffff

timeout: 5

# --- KERNEL BOOT ENTRIES ---
/Kernel
    protocol: limine
    path: boot():/boot/kernel
    module_path: boot():/boot/bootvid.sys
    module_path: boot():/boot/serial.sys
    module_path: boot():/boot/keyboard.sys
    module_path: boot():/boot/kdbg.sys
    module_path: boot():/boot/tarfs.sys
    module_path: boot():/boot/beep.sys
    module_path: boot():/boot/gfx.sys
    module_path: boot():/boot/mouse.sys
    module_path: boot():/boot/e1000.sys
    # module_path: boot():/boot/ac97.sys
    module_path: boot():/boot/hda.sys
    module_path: boot():/boot/initrd.tar
     # module_path: boot():/boot/panicfs.sys
