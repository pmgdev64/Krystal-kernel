[package]
name = "bootvid"
version = "0.1.0"
edition = "2021"

[dependencies]
noto-sans-mono-bitmap = { version = "0.3", default-features = false, features = ["regular", "bold", "size_16", "size_24", "unicode-basic-latin", "unicode-latin-1-supplement"] }
bootvid-abi = { path = "../bootvid-abi" }
driver-abi = { path = "../driver-abi" }

[profile.dev]
opt-level = 2
